events {}

http {
    server {
        listen 80;

        # ─── Auth service proxy ─────────────────────────────────
        location /service/login-service/ {
            proxy_pass http://login-service:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                add_header 'Access-Control-Max-Age' 86400;
                return 204;
            }
        }

        # ─── Reservation service proxy ──────────────────────────
        # ⚠ Trailing slash on the location is important: without it,
        #   /service/reservation-service/search maps to
        #   http://reservation-service:8082/service/reservation-service/search
        #   which 404s. With it, the prefix is stripped.
        location /service/reservation-service/ {
            proxy_pass http://reservation-service:8082/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS — Authorization must be allowed or JWT requests get blocked
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                add_header 'Access-Control-Max-Age' 86400;
                return 204;
            }
        }

        # ─── Reservation frontend (static files) ────────────────
        location /reservation/ {
            alias /usr/share/nginx/html/reservation/;
            index index.html;
            try_files $uri $uri/ /reservation/index.html;
        }

        # ─── Optional: root redirect ────────────────────────────
        location = / {
            return 302 /reservation/;
        }

        # ─── Optional: create-service proxy (kept commented) ────
        # location /service/create-service/ {
        #     proxy_pass http://campus-create-service:8080/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     add_header 'Access-Control-Allow-Origin' '*' always;
        #     add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        #     add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        #     if ($request_method = 'OPTIONS') {
        #         add_header 'Access-Control-Allow-Origin' '*';
        #         add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        #         add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
        #         add_header 'Access-Control-Max-Age' 86400;
        #         return 204;
        #     }
        # }
    }
}