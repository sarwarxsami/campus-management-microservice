<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Service - API Tester</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <aside>
            <div class="aside-logo">
                🔐 Login Service
                <small>API Tester</small>
            </div>
            <nav>
                <div class="nav-group">Authentication</div>
                <a class="active" data-tab="login">🔑 Login</a>
                <a data-tab="logout">🚪 Logout</a>
            </nav>
        </aside>

        <main class="page">
            <!-- Login -->
            <div class="panel active" id="tab-login">
                <h1>Login</h1>
                <div class="page-sub">POST /login</div>
                <div class="card">
                    <h2>Request Body</h2>
                    <div class="form-row">
                        <div class="form-field">
                            <label>Username *</label>
                            <input type="text" id="login-username" value="john_doe" placeholder="Username">
                        </div>
                        <div class="form-field">
                            <label>Password *</label>
                            <input type="password" id="login-password" value="password123" placeholder="Password">
                        </div>
                        <div class="form-field">
                            <button class="btn btn-primary" id="btn-login">Login</button>
                        </div>
                    </div>
                </div>
                <div id="result-login"></div>
            </div>

            <!-- Logout -->
            <div class="panel" id="tab-logout">
                <h1>Logout</h1>
                <div class="page-sub">Clear JWT Token</div>
                <div class="card">
                    <h2>Current Session</h2>
                    <div class="form-row">
                        <div class="form-field" style="flex:1;">
                            <div id="session-info" style="padding:10px; background:#f8fafc; border-radius:6px; border:1px solid var(--border);">
                                <div><strong>Status:</strong> <span id="auth-status">Checking...</span></div>
                                <div style="margin-top:8px;"><strong>Token:</strong> <span id="token-display" style="font-family:monospace;font-size:11px;word-break:break-all;">None</span></div>
                            </div>
                        </div>
                        <div class="form-field">
                            <button class="btn btn-primary" id="btn-logout" style="background:var(--danger);">Logout</button>
                        </div>
                    </div>
                </div>
                <div id="result-logout"></div>
            </div>
        </main>
    </div>

    <script src="assets/js/utils.js"></script>
</body>
</html>
