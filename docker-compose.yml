services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    networks:
      - user-net
      - task-net
      - default-net
    depends_on:
      - search-service
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf
  db:
    image: postgres:latest
    container_name: postgres-db
    volumes:
      - new-vol:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgresdb
    ports:
      - "5432:5432"
    networks:
      - db-net

  create-service:
    build: ./create-service/create-backend/
    container_name: campus-create-service
    networks:
      - task-net
      - db-net
    env_file:
      - ./.env
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: postgresdb
      DB_USER: user
      DB_PASSWORD: password

  login-service:
    build: ./login-service/login-backend
    container_name: campus-login-service
    networks:
      - user-net
      - db-net
    env_file:
      - ./.env
    depends_on:
      - db
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: postgresdb
      DB_USER: user
      DB_PASSWORD: password

  search-service:
    build: ./search-service/search-backend/
    container_name: campus-search-service
    networks:
      - default-net
      - db-net
    ports:
      - "3001:3001"
    env_file:
      - ./.env
    depends_on:
      - db

